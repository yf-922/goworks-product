name: API Smoke Checks

on:
  push:
  pull_request:

jobs:
  static-and-test-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Verify Go modules
        run: go mod download

      - name: Build backend
        run: go build ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check API smoke test syntax
        run: python -m py_compile tests/api_smoke_test.py

      - name: Explain runtime smoke test prerequisite
        run: |
          echo "Runtime API smoke test is not executed in CI yet."
          echo "Reason: the project still needs reproducible MySQL/Redis schema and seed data."
          echo "After schema.sql and seed.sql are added, run: python tests/api_smoke_test.py"
